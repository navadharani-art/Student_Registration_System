<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Student Database Page
        </title>
        <style>
            body{
                font-family: Arial, sans-serif;
                text-align: center;
                margin-top: 150px;
                background-color: rgb(191, 146, 233);
            }
            h1{
                color: #333;
            }
            button {
                display: inline-block;
                padding: 12px 25px;
                margin: 15px;
                text-decoration: none;
                color: #333;
                background-color: #f6fd71;
                border-radius: 5px;
                font-size: 16px;
            }
            button:hover {
                background-color: #ddeb1f;
            }
        </style>
    </head>
    <body>
        <h1>
            Welcome to Student Database Page
        </h1>
        <a href="/signup">
            <button>Sign Up</button>
        </a>
        <a href="/signin">
            <button>Sign In</button>
        </a>
    </body>
</html>
